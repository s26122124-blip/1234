<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>璇 的數位名片</title>
    <style>
        /* 1. 全局重置樣式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 2. 背景與整體置中 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 馬卡龍柔和漸層背景 */
            background: linear-gradient(135deg, #e8f5e9 0%, #f3e5f5 50%, #fce4ec 100%);
            padding: 20px;
        }

        /* 3. 卡片主體（馬卡龍色系、毛玻璃、微陰影） */
        .profile-card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 360px;
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(230, 185, 205, 0.35), 
                        0 5px 15px rgba(0, 0, 0, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(220, 170, 195, 0.45);
        }

        /* 4. 圓形大頭貼照片 */
        .avatar-wrapper {
            margin-bottom: 20px;
            display: inline-block;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* 正圓形 */
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 18px rgba(225, 170, 190, 0.4);
        }

        /* 5. 名字與簡介 */
        .name {
            font-size: 24px;
            font-weight: 700;
            color: #4a4a4a;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 14px;
            color: #7a7a7a;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* 6. 按鈕區域 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0
