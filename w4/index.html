<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哆啦A夢 - 朋友動態留言板</title>
  
  <!-- Google 字體：圓潤可愛的字體風格 -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全局變數與風格設定 (哆啦A夢主題色)
       ========================================== */
    :root {
      /* 【顏色控制區】你可以在這裡修改主要配色 */
      --dora-blue: #0099e5;     /* 哆啦A夢藍 */
      --dora-red: #e60012;      /* 經典紅色 (首領項圈/鼻子) */
      --dora-yellow: #ffcc00;   /* 鈴鐺黃 */
      --dora-white: #ffffff;    /* 純白 (肚子/臉) */
      --bg-color: #eaf6ff;      /* 網頁背景淺藍色 */
      --text-dark: #333333;     /* 主要文字顏色 */
      
      /* 【輪播秒數控制】注意：JavaScript 端的秒數也要同步修改 */
      --transition-speed: 0.5s; /* 動畫過渡時間 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px;
    }

    /* ==========================================
       2. 頁首與標題設計
       ========================================== */
    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    h1 {
      color: var(--dora-blue);
      font-size: 2.5rem;
      font-weight: 900;
      text-shadow: 3px 3px 0px var(--dora-white), 5px 5px 0px rgba(0, 0, 0, 0.15);
      display: inline-block;
      position: relative;
      padding: 10px 20px;
    }

    /* 標題裝飾：百寶袋形狀底襯 */
    .pocket-bg {
      background: var(--dora-white);
      border: 4px solid var(--dora-blue);
      border-radius: 0 0 100px 100px;
      padding: 15px 40px;
      display: inline-block;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #555;
      font-weight: 700;
    }

    /* ==========================================
       3. 載入中動畫 (酷炫哆啦A夢鈴鐺/旋轉竹蜻蜓感)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .bell-spinner {
      width: 70px;
      height: 70px;
      background-color: var(--dora-yellow);
      border: 4px solid #333;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 6px 0px #cda000;
      animation: bounce 1.2s infinite ease-in-out alternate, rotate 2s infinite linear;
    }

    /* 鈴鐺細節繪製 */
    .bell-spinner::before {
      content: '';
      position: absolute;
      top: 22px;
      left: 0;
      width: 100%;
      height: 8px;
      background: #333;
    }

    .bell-spinner::after {
      content: '';
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #333;
      border-radius: 50%;
    }

    .loading-text {
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--dora-blue);
      letter-spacing: 2px;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }

    /* ==========================================
       4. 瀑布流留言牆 (Masonry Layout)
       ========================================== */
    .wall-container {
      max-width: 1200px;
      margin: 0 auto;
      
      /* CSS 瀑布流核心設定 */
      column-count: 3;       /* 預設顯示 3 欄 */
      column-gap: 20px;      /* 欄位間距 */
    }

    /* 響應式調整：手機與平板視窗 */
    @media (max-width: 900px) {
      .wall-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .wall-container { column-count: 1; }
    }

    /* ==========================================
       5. 留言卡片與高亮 (Highlight) 特效
       ========================================== */
    .card {
      background: var(--dora-white);
      border: 3px solid var(--dora-blue);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px; /* 卡片垂直間距 */
      break-inside: avoid; /* 防止卡片被斷欄切割 */
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;

      /* 平滑過渡動畫 (影響變暗、放大、模糊等效果) */
      transition: all var(--transition-speed) ease;
      opacity: 0.85;
      transform: scale(0.98);
      filter: blur(0.5px);
    }

    /* 卡片頂部裝飾：哆啦A夢紅項圈與黃鈴鐺 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: var(--dora-red);
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    /* 留言者頭像 (亮黃色鈴鐺造型) */
    .avatar-bell {
      width: 32px;
      height: 32px;
      background-color: var(--dora-yellow);
      border: 2px solid #333;
      border-radius: 50%;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .author-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--dora-blue);
    }

    .time-stamp {
      font-size: 0.75rem;
      color: #888;
      margin-left: auto;
    }

    .message-content {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-dark);
      white-space: pre-wrap; /* 保留留言中的換行 */
      word-break: break-word;
    }

    /* 【高亮亮起特效 (Highlight Class)】 */
    /* 被 JS 選中的卡片會加上 .highlight 類別 */
    .card.highlight {
      opacity: 1;
      transform: scale(1.05); /* 放大 */
      filter: blur(0px);      /* 清晰 */
      border-color: var(--dora-red); /* 變換成紅色邊框 */
      box-shadow: 0 12px 25px rgba(0, 153, 229, 0.4), 0 0 15px var(--dora-yellow); /* 外發光特效 */
      z-index: 10;
    }

    /* 當有卡片高亮時，未高亮卡片稍微變暗變模糊 */
    .wall-container.has-active .card:not(.highlight) {
      opacity: 0.5;
      filter: blur(1.5px);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- 頁首標題區 -->
  <header>
    <div class="pocket-bg">
      <h1>哆啦A夢 留言板</h1>
      <p class="subtitle">來自四次元口袋的友情留言牆 ✨</p>
    </div>
  </header>

  <!-- 載入中酷炫動畫 -->
  <div id="loading">
    <div class="bell-spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流卡片牆容器 -->
  <div id="wall" class="wall-container"></div>

  <script>
    // ==========================================
    // 全局變數與設定
    // ==========================================
    // Google 試算表 CSV 網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDyw1lvUFG7YfCFngSY0DUQotXzi_DYykITR7pPEKnX_HBvGKpQ5jKigqd8Kg4h1fV225-b8xe4Wya/pub?output=csv';

    /* 【輪播秒數控制】
       這裡設定每幾毫秒 (ms) 切換下一張卡片 (3000ms = 3秒) */
    const ROTATE_INTERVAL_MS = 3000; 

    let cardsElements = []; // 儲存所有生成的 DOM 卡片
    let currentIndex = 0;   // 當前高亮的卡片索引
    let timerId = null;     // 儲存 setInterval 的 ID

    // ==========================================
    // 1. CSV 解析器 (處理雙引號、逗號與換行)
    // ==========================================
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') { // 處理轉義雙引號 ("")
            currentCell += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !insideQuotes) { // 遇逗號且不在引號內 -> 換欄
          row.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) { // 遇換行且不在引號內 -> 換行
          if (char === '\r' && nextChar === '\n') i++; // 處理 \r\n
          row.push(currentCell.trim());
          if (row.some(cell => cell !== '')) lines.push(row);
          row = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      
      if (currentCell || row.length > 0) {
        row.push(currentCell.trim());
        if (row.some(cell => cell !== '')) lines.push(row);
      }

      return lines;
    }

    // ==========================================
    // 2. Fetch 資料串接與渲染
    // ==========================================
    async function loadMessages() {
      const loadingEl = document.getElementById('loading');
      const wallEl = document.getElementById('wall');

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 移除 CSV 第一行 (標題列：時間戳記, 姓名, 悄悄話)
        const dataRows = parsedData.slice(1);

        // 隱藏載入動畫
        loadingEl.style.display = 'none';

        if (dataRows.length === 0) {
          wallEl.innerHTML = '<p style="text-align:center; width:100%;">目前還沒有任何留言喔！</p>';
          return;
        }

        // 動態生成留言卡片
        dataRows.forEach((row) => {
          // 欄位順序預設：[0]時間戳記, [1]姓名, [2]悄悄話
          const time = row[0] || '';
          const name = row[1] || '匿名朋友';
          const message = row[2] || '';

          // 創建卡片 DOM
          const card = document.createElement('div');
          card.className = 'card';
          
          // 格式化日期顯示 (僅取日期時間)
          const formattedTime = time ? time.split(' ')[0] : '';

          card.innerHTML = `
            <div class="card-header">
              <div class="avatar-bell">🔔</div>
              <div class="author-name">${escapeHTML(name)}</div>
              <div class="time-stamp">${escapeHTML(formattedTime)}</div>
            </div>
            <div class="message-content">${escapeHTML(message)}</div>
          `;

          wallEl.appendChild(card);
        });

        // 收集所有生成的卡片，準備進行輪播特效
        cardsElements = Array.from(document.querySelectorAll('.card'));

        // 開始自動輪播亮起特效
        if (cardsElements.length > 0) {
          wallEl.classList.add('has-active'); // 啟用未選中卡片的暗化遮罩效果
          startCarousel();
        }

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = `<div class="loading-text" style="color: var(--dora-red);">載入留言失敗，請稍後再試。</div>`;
      }
    }

    // HTML 轉義防護 (避免 XSS 攻擊)
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================
    // 3. 隨時間輪播高亮 (Highlight) 特效邏輯
    // ==========================================
    function startCarousel() {
      // 立即觸發第一張卡片高亮
      highlightCard(currentIndex);

      // 設定計時器，定期切換高亮
      timerId = setInterval(() => {
        // 移除當前卡片的高亮
        cardsElements[currentIndex].classList.remove('highlight');

        // 計算下個要高亮的卡片索引 (循環播放)
        currentIndex = (currentIndex + 1) % cardsElements.length;

        // 加上新卡片的高亮
        highlightCard(currentIndex);
      }, ROTATE_INTERVAL_MS);
    }

    function highlightCard(index) {
      const activeCard = cardsElements[index];
      activeCard.classList.add('highlight');

      // 自動平滑滾動至目前高亮的卡片 (確保畫面上能看到)
      activeCard.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    }

    // 頁面載入完成後執行
    document.addEventListener('DOMContentLoaded', loadMessages);
  </script>
</body>
</html>
